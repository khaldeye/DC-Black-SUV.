<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>DC Black/SUV Weekly</title>
<style>
:root{--bg:#f4f4f4;--surface:#fff;--text:#111;--muted:#686868;--line:#e7e7e7;--chip:#e9e9e9;--blue:#0A84FF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:900px;margin:auto}
.header{background:#fff;padding:18px 16px 10px;border-bottom:1px solid var(--line)}
.headerRow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.headerTitle{font-size:25px;font-weight:700}
.refresh{border:0;background:#111;color:#fff;border-radius:999px;padding:11px 18px;font-size:16px;font-weight:600}
.page{padding:0 16px 30px}
.title{text-align:center;font-size:26px;font-weight:700;margin:18px 0}
.tabs{display:flex;justify-content:center;gap:14px;margin-bottom:14px}
.tab{border:0;background:#e8e8e8;color:#1674e8;padding:14px 30px;border-radius:999px;font-size:18px}
.tab.active{background:#111;color:#fff}
.days{display:flex;justify-content:space-between;gap:10px;overflow:auto;border-bottom:1px solid #cfcfcf}
.day{min-width:48px;border:0;background:transparent;padding:8px 0 12px;border-bottom:5px solid transparent}
.day.active{border-bottom-color:#111}
.dow{display:block;font-size:18px;margin-bottom:8px}.num{display:block;font-size:23px;font-weight:700;color:#2f7df2}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 14px}
.filter,.select{border:1.5px solid #d1d1d1;background:#fff;border-radius:24px;padding:13px 16px;font-size:17px}
.filter.active{background:#111;color:#fff;border-color:#111}
.meta{color:var(--muted);font-size:13px;line-height:1.4;margin-bottom:12px}
.section{background:#ececec;margin:0 -16px;padding:18px 16px;font-size:24px;font-weight:700}
.card{display:grid;grid-template-columns:1fr 130px;gap:16px;background:#fff;border-bottom:1px solid var(--line);padding:18px 0}
.time{font-size:18px;color:var(--muted);margin-bottom:10px}
.name{font-size:23px;font-weight:700;line-height:1.15;margin-bottom:10px}
.place{font-size:20px;color:var(--muted);line-height:1.25}
.tag{display:inline-block;margin-top:12px;background:#f0f0f0;color:#666;border-radius:8px;padding:6px 12px;font-size:14px}
.pickup{font-size:15px;margin-top:11px;color:#222}
.save{margin-top:16px;border:0;background:#f1f1f1;border-radius:999px;padding:12px 18px;font-size:17px}
.thumb{width:120px;height:120px;background:#f3f5f7;align-self:center;justify-self:end;position:relative;text-decoration:none;overflow:hidden}
.thumb.map:before{content:"";position:absolute;inset:0;background:
linear-gradient(90deg,transparent 0 28%,#dce7ee 28% 31%,transparent 31% 72%,#dce7ee 72% 75%,transparent 75%),
linear-gradient(0deg,transparent 0 34%,#dce7ee 34% 37%,transparent 37% 66%,#dce7ee 66% 69%,transparent 69%),
linear-gradient(135deg,transparent 0 48%,#c5d8e5 48% 51%,transparent 51%)}
.thumb.map:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--blue);left:51px;top:49px}
.thumb.plane:before{content:"✈";position:absolute;font-size:92px;color:#2f68ff;left:12px;top:10px;transform:rotate(-24deg)}
.empty{background:#fff;padding:25px 0;color:var(--muted)}
@media(max-width:620px){
  .card{grid-template-columns:1fr 105px}
  .thumb{width:105px;height:105px}
  .name{font-size:21px}
  .place{font-size:18px}
  .tab{padding:13px 26px}
  .headerTitle{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="headerRow">
      <div class="headerTitle">DC Black/SUV</div>
      <div style="display:flex;align-items:center;gap:8px"><button id="resetKeyBtn" title="Change Ticketmaster API key" style="border:0;background:transparent;color:#555;font-size:12px;padding:8px">Reset key</button><button id="refreshBtn" class="refresh">Refresh</button></div>
    </div>
  </div>

  <div class="page">
    <div class="title">Discover</div>

    <div class="tabs">
      <button id="eventsTab" class="tab active">Events</button>
      <button id="airportsTab" class="tab">Airports</button>
    </div>

    <div id="days" class="days"></div>

    <div class="filters">
      <button id="premiumBtn" class="filter">🔥 5-star only</button>
      <select id="typeSel" class="select">
        <option value="all">All event types</option>
        <option value="conference">Conferences</option>
        <option value="gala">Galas / receptions</option>
        <option value="concert">Concerts</option>
        <option value="sport">Sports</option>
        <option value="expo">Expos / festivals</option>
      </select>
    </div>

    <div id="weekMeta" class="meta">Loading…</div>
    <div id="content"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="live-refresh.js"></script>
<script>
(() => {
  const cfg=window.APP_CONFIG||{dataUrl:"./events.json",refreshMinutes:15};
  const order=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let S={data:null,day:null,premium:false,type:"all",mode:"events"};
  const todayISO=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`;};

  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const maps=a=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a||"");

  function groupDays(events){
    const m=new Map();
    events.forEach(e=>{ if(!m.has(e.day)) m.set(e.day,e.date); });
    return order.filter(d=>m.has(d)).map(day=>({day,date:m.get(day)}));
  }

  function dayLabel(iso){
    const d=new Date(iso+"T12:00:00");
    return {
      letter:d.toLocaleDateString(undefined,{weekday:"short"}).slice(0,1),
      num:d.getDate(),
      full:d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})
    };
  }

  function available(){
    if(!S.data) return [];
    return S.data.events.filter(e=>e.date>=todayISO() && !["cancelled","canceled"].includes((e.status||"").toLowerCase()) && (S.mode==="airports" ? e.type==="airport" : e.type!=="airport"));
  }

  function renderDays(){
    const ds=groupDays(available());
    if(!S.day || !ds.some(x=>x.day===S.day)) S.day=ds[0]?.day || null;
    $("days").innerHTML="";
    ds.forEach(x=>{
      const l=dayLabel(x.date);
      const b=document.createElement("button");
      b.className="day"+(S.day===x.day?" active":"");
      b.innerHTML=`<span class="dow">${l.letter}</span><span class="num">${l.num}</span>`;
      b.onclick=()=>{S.day=x.day;render();};
      $("days").appendChild(b);
    });
  }

  function render(){
    if(!S.data) return;

    $("eventsTab").className="tab"+(S.mode==="events"?" active":"");
    $("airportsTab").className="tab"+(S.mode==="airports"?" active":"");
    $("typeSel").style.display=S.mode==="airports"?"none":"inline-block";
    $("premiumBtn").className="filter"+(S.premium?" active":"");

    renderDays();

    $("weekMeta").textContent=`${S.data.week_label} • Last searched: ${S.data.generated_at ? new Date(S.data.generated_at).toLocaleString() : "unknown"} • ${S.data.region}`;

    const base=available();
    const rows=base.filter(e =>
      e.day===S.day &&
      (!S.premium || Number(e.rating)===5) &&
      (S.mode==="airports" || S.type==="all" || e.type===S.type)
    );

    const date=groupDays(base).find(x=>x.day===S.day)?.date;
    $("content").innerHTML="";

    if(!date){
      $("content").innerHTML='<div class="empty">No opportunities available.</div>';
      return;
    }

    const sec=document.createElement("div");
    sec.className="section";
    sec.textContent=dayLabel(date).full;
    $("content").appendChild(sec);

    if(!rows.length){
      const e=document.createElement("div");
      e.className="empty";
      e.textContent="No matching opportunities for this day.";
      $("content").appendChild(e);
      return;
    }

    rows.forEach(e=>{
      const c=document.createElement("div");
      c.className="card";
      c.innerHTML=`
        <div>
          <div class="time">${esc(e.time)}</div>
          <div class="name">${esc(e.name)}</div>
          <div class="place">${esc(e.address)}</div>
          <div class="tag">${esc(e.tag||e.type)}${e.status && e.status!=="onsale" ? " • "+esc(e.status) : ""}</div>
          <div class="pickup"><b>Best pickup:</b> ${esc(e.pickup)}</div>
          <button class="save">🔖 Save</button>
        </div>
        <a class="thumb ${e.type==="airport"?"plane":"map"}"
           href="${maps(e.address)}" target="_blank" rel="noopener"
           aria-label="Open map"></a>`;
      $("content").appendChild(c);
    });
  }

  async function curated(){
    try{
      const r=await fetch("./curated-events.json?t="+Date.now(),{cache:"no-store"});
      if(!r.ok) return [];
      const j=await r.json();
      return (j.events||[]).filter(e=>["conference","gala","airport"].includes(e.type));
    }catch{return [];}
  }
  function mergeEvents(primary,extras){
    const normalize=e=>[e.date,(e.name||"").toLowerCase().replace(/[^a-z0-9]/g,""),(e.address||"").toLowerCase().replace(/[^a-z0-9]/g,"")].join("|");
    const map=new Map();
    for(const e of [...extras,...primary])map.set(normalize(e),e);
    return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date)||String(a.time).localeCompare(String(b.time)));
  }
  async function load(force=true){
    const url=cfg.dataUrl+(force?((cfg.dataUrl.includes("?")?"&":"?")+"t="+Date.now()):"");
    try{
      const r=await fetch(url,{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      S.data=await r.json();
      S.data.events=mergeEvents(S.data.events,await curated());
      render();
    }catch(err){
      $("weekMeta").textContent="Could not load the latest schedule.";
    }
  }

  $("eventsTab").onclick=()=>{S.mode="events";S.day=null;render();};
  $("airportsTab").onclick=()=>{S.mode="airports";S.day=null;render();};
  $("premiumBtn").onclick=()=>{S.premium=!S.premium;render();};
  $("typeSel").onchange=()=>{S.type=$("typeSel").value;render();};
  $("resetKeyBtn").onclick=()=>{localStorage.removeItem("dc_suv_tm_key");$("weekMeta").textContent="API key cleared from this browser. Tap Refresh to enter a new key.";};
  $("refreshBtn").onclick=async()=>{
    const b=$("refreshBtn");b.disabled=true;b.textContent="Searching…";
    try{
      let key=cfg.ticketmasterPublicKey || localStorage.getItem("dc_suv_tm_key");
      if(!key){
        key=window.prompt("One-time setup: paste your Ticketmaster Consumer Key to search live events. It will be stored only in this browser, not on GitHub. Cancel to keep the published schedule.");
        if(!key){$("weekMeta").textContent="Live search not configured. Showing published schedule.";return;}
        key=key.trim();
        if(!key){$("weekMeta").textContent="No key entered. Showing published schedule.";return;}
        localStorage.setItem("dc_suv_tm_key",key);
      }
      const fresh=await window.searchLiveDMVEvents(key);
      const previous=(S.data?.events||[]).filter(e=>e.date>=todayISO());
      S.data={...fresh,events:mergeEvents(fresh.events,mergeEvents(previous,await curated()))};S.day=null;render();
      $("weekMeta").textContent+=" • Live search completed on this device";
    }catch(err){
      $("weekMeta").textContent="Live search failed: "+err.message+" • Showing the published schedule. To change your key, use Reset key.";
    }finally{b.disabled=false;b.textContent="Refresh";}
  };

  load(true);
  // Weekly updates are published by GitHub Actions; no fake 15-minute search.

  if("serviceWorker"in navigator&&location.protocol.startsWith("http")){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
})();
</script>
</body>
</html>
